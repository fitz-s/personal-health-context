[project]
name = "phctx"
version = "0.1.0"
description = "Personal Health Context: local durable context behind one ChatGPT conversation"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.2.0",
  "pypdf==6.19.0",
  "cryptography==50.0.1",
  "jsonschema==4.26.0",
]

[project.scripts]
phctx = "phctx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phctx"]
